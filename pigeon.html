<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spinning pigeon</title>
<style>
:root{--bg1:#e9edf1;--bg2:#c9d1d9;--fg:#27303a;--mute:#5d6975;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a323b;--bg2:#161b21;--fg:#eef1f4;--mute:#9aa6b2}}
:root[data-theme="dark"]{--bg1:#2a323b;--bg2:#161b21;--fg:#eef1f4;--mute:#9aa6b2}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2));color:var(--fg);font-family:Georgia,"Times New Roman",serif;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.cap{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;pointer-events:none}
.cap h1{font-size:1.4rem;font-weight:400;margin:0;letter-spacing:.02em}
.cap p{margin:4px 0 0;font-size:.85rem;color:var(--mute);font-style:italic}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="cap"><h1>Rock pigeon</h1><p>Drag to turn it around</p></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(30,1,0.1,50);
camera.position.set(0,1.8,9.5);camera.lookAt(0,.95,0);

// studio-style environment for soft reflections
{const c=document.createElement('canvas');c.width=256;c.height=128;const x=c.getContext('2d');
 const g=x.createLinearGradient(0,0,0,128);g.addColorStop(0,'#9ec3ee');g.addColorStop(.5,'#f4f6f8');g.addColorStop(.52,'#8a8478');g.addColorStop(1,'#3d3a35');
 x.fillStyle=g;x.fillRect(0,0,256,128);x.fillStyle='#fff';x.fillRect(40,18,54,24);x.fillRect(170,28,40,16);
 const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;
 scene.environment=new THREE.PMREMGenerator(renderer).fromEquirectangular(t).texture;}
const sun=new THREE.DirectionalLight(0xfff1dd,2.2);sun.position.set(4,7,5);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-4,right:4,top:4,bottom:-4});sun.shadow.bias=-.0006;scene.add(sun);
const fill=new THREE.DirectionalLight(0xaac4ff,.5);fill.position.set(-5,2,-4);scene.add(fill);

const C=h=>new THREE.Color(h).convertSRGBToLinear(),V=(x,y,z)=>new THREE.Vector3(x,y,z);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:C(c),roughness:.8},o));
const P=(c,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color:C(c),roughness:.5},o));
const ell=(r,sx,sy,sz,mat,x,y,z)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,48,32),mat);m.scale.set(sx,sy,sz);m.position.set(x,y,z);return m;};
const srgb=t=>{t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;};

// procedural feather texture: alpha-shaped vane, rachis, barbs, optional dark tip/band
const wf=u=>.46*Math.pow(Math.max(0,Math.sin(Math.PI*Math.pow(u,.7))),.6);
function ftex(o={}){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.beginPath();for(let u=0;u<=1.001;u+=.02)x.lineTo(u*256,32-64*wf(u));
  for(let u=1;u>=-.001;u-=.02)x.lineTo(u*256,32+64*wf(u));
  x.fillStyle='#c4c4c4';x.fill();
  const gs=['#a8a8a8','#dcdcdc','#989898','#e8e8e8'];x.lineWidth=1.3;
  for(let i=0;i<150;i++){const u0=Math.random()*.95,u1=Math.min(1,u0+.1+Math.random()*.08);
    [-1,1].forEach(sg=>{x.strokeStyle=gs[(Math.random()*4)|0];x.beginPath();x.moveTo(u0*256,32);
      x.lineTo(u1*256,32+sg*64*wf(u1)*(.9+Math.random()*.16));x.stroke();});}
  x.strokeStyle='#f0f0f0';x.lineWidth=1.6;x.beginPath();x.moveTo(0,32);x.lineTo(248,32);x.stroke();
  if(o.start!==undefined){x.globalCompositeOperation='source-atop';
    const g=x.createLinearGradient(o.start*256,0,(o.start+.08)*256,0);g.addColorStop(0,'rgba(8,8,10,0)');g.addColorStop(1,'rgba(8,8,10,'+o.dark+')');
    x.fillStyle=g;x.fillRect(0,0,256,64);}
  return srgb(new THREE.CanvasTexture(c));
}
const T={plain:ftex(),bar:ftex({start:.12,dark:.92}),flight:ftex({start:.7,dark:.75}),tail:ftex({start:.66,dark:.9})};
const FM={};
const fmat=(tk,col,o={})=>{const m=M(col,Object.assign({map:T[tk],alphaTest:.4,side:THREE.DoubleSide,roughness:.75},o));
  m.userData.depth=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking,map:T[tk],alphaTest:.4});return m;};
function fGeo(len,wid,d=.05){
  const g=new THREE.PlaneGeometry(1,1,10,4);g.rotateX(-Math.PI/2);const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const t=p.getX(i)+.5,z=p.getZ(i);
    p.setXYZ(i,-t*len,-z*z*wid*1.4-t*t*len*d,z*wid);}
  g.computeVertexNormals();return g;
}
function put(parent,geo,mat,pos,n,dir,lift){
  const m=new THREE.Mesh(geo,mat),nn=n.clone().normalize(),d=dir.clone();
  d.addScaledVector(nn,-d.dot(nn)).normalize();
  const X=d.clone().negate(),Z=new THREE.Vector3().crossVectors(X,nn);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X,nn,Z));
  m.rotateZ(-lift);m.position.copy(pos);m.customDepthMaterial=mat.userData.depth;m.castShadow=true;parent.add(m);return m;
}
// ---- sculpted torso/neck: lofted cross-sections along a spine curve (no spheres) ----
const cr=(a,b,c,d,u)=>.5*(2*b+(-a+c)*u+(2*a-5*b+4*c-d)*u*u+(-a+3*b-3*c+d)*u*u*u);
function loft(pts,rad,mat,colFn){
  const S=64,A=48,cv=new THREE.CatmullRomCurve3(pts.map(p=>V(p[0],p[1],0))),n=rad.length-1,Z=V(0,0,1),rd=k=>rad[Math.max(0,Math.min(n,k))],cl=t=>Math.min(Math.max(t,0),1);
  const R=t=>{const f=Math.min(t,.9999)*n,i=Math.floor(f),u=f-i;return [0,1,2].map(k=>Math.max(0,cr(rd(i-1)[k],rd(i)[k],rd(i+1)[k],rd(i+2)[k],u)));};
  const at=(t,ph)=>{const T=cv.getTangent(cl(t)),U=new THREE.Vector3().crossVectors(Z,T),r=R(cl(t)),c=Math.cos(ph);
    return cv.getPoint(cl(t)).addScaledVector(U,c*(c>0?r[0]:r[1])).addScaledVector(Z,Math.sin(ph)*r[2]);};
  const nrm=(t,ph)=>{const e=.004,p=at(t,ph),q=at(t+e,ph).sub(at(t-e,ph)),w=at(t,ph+e).sub(at(t,ph-e)),nn=q.cross(w).normalize();
    return nn.dot(p.sub(cv.getPoint(cl(t))))<0?nn.negate():nn;};
  const pos=[],col=[],idx=[];
  for(let i=0;i<=S;i++){const t=i/S,cc=colFn?colFn(t):null;for(let j=0;j<=A;j++){const p=at(Math.min(t,.9999),j/A*Math.PI*2);pos.push(p.x,p.y,p.z);if(cc)col.push(cc.r,cc.g,cc.b);}}
  for(let i=0;i<S;i++)for(let j=0;j<A;j++){const a=i*(A+1)+j,b=a+A+1;idx.push(a,a+1,b,b,a+1,b+1);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  if(colFn)g.setAttribute('color',new THREE.Float32BufferAttribute(col,3));g.setIndex(idx);g.computeVertexNormals();
  const nm=g.attributes.normal;for(let i=0;i<=S;i++){const a=i*(A+1),b=a+A,x=nm.getX(a)+nm.getX(b),y=nm.getY(a)+nm.getY(b),z=nm.getZ(a)+nm.getZ(b),l=Math.hypot(x,y,z)||1;nm.setXYZ(a,x/l,y/l,z/l);nm.setXYZ(b,x/l,y/l,z/l);}
  const mesh=new THREE.Mesh(g,mat);mesh.castShadow=true;return {mesh,at,nrm};
}
const fmC={},fc=(tk,col,o)=>{const k=tk+col+JSON.stringify(o||{});return fmC[k]||(fmC[k]=fmat(tk,col,o));};
const pigeon=new THREE.Group();let tgt=pigeon;
const eb=(m,...a)=>{const e=ell(...a.slice(0,4),m,...a.slice(4));e.castShadow=true;tgt.add(e);return e;};

// torso: tapered rump, deep rounded breast, shoulders rising into the neck
const L=loft([[-1.45,.43],[-1.2,.47],[-.7,.6],[-.1,.73],[.5,.85],[1,1],[1.3,1.2],[1.42,1.4],[1.45,1.52]],
 [[.02,.02,.02],[.2,.18,.25],[.45,.4,.5],[.7,.55,.62],[.78,.6,.64],[.68,.62,.55],[.5,.5,.42],[.3,.3,.25],[.01,.01,.01]],M(0x93a5b8,{roughness:.95}));
pigeon.add(L.mesh);
const po=(t,a,o)=>L.at(t,a).addScaledVector(L.nrm(t,a),o);

// body plumage, coloured by region: dark iridescent breast, pale belly and flanks, blue-grey back, pale rump
{const g=fGeo(.34,.15),pick=(t,a)=>{const A=Math.abs(a);
  if(t>.18&&t<.62&&A>.5&&A<1.5)return null;
  if(t>.68)return fc('plain',t>.74?0x3f5866:0x5c7686,{metalness:.35,roughness:.4});
  if(A>1.9)return fc('plain',0xdbe5f2);if(A>1.5)return fc('plain',0xc6d4e6);
  if(t<.3)return fc('plain',0xc9d3de);return fc('plain',0xb4c2d2);};
 let j=0;for(let t=.12;t<=.8;t+=.06,j++)for(let a=-Math.PI+(j%2)*.15;a<Math.PI;a+=.3){const m=pick(t,a);
  if(m)put(pigeon,g,m,po(t,a,.012),L.nrm(t,a),V(-1,-.5,0),.15);}}

// wings: pale coverts with black bars, then long dark flight feathers
const gS=fGeo(.3,.12),gL=fGeo(.46,.17),mBar=fc('bar',0xe6eef8),mPl=fc('plain',0xe6eef8),mFl=fc('flight',0x6e8190);
const rows=[[.55,.58,gS,mPl],[.72,.6,gL,mBar],[.89,.6,gL,mPl],[1.06,.58,gL,mBar],[1.23,.56,gL,mPl],[1.4,.54,gL,mBar]];
const fls=[];for(let k=0;k<10;k++)fls.push(fGeo(1+k*.04,.14,.18));
[-1,1].forEach(sg=>{
  rows.forEach(([ph,th,g,m],j)=>{for(let t=th-(j%2)*.025;t>=.2;t-=.05){const a=sg*ph;put(pigeon,g,m,po(t,a,.02+j*.006),L.nrm(t,a),V(-1,-.1,0),.12);}});
  for(let k=0;k<10;k++){const t=.5-k*.032,a=sg*(1.52+k*.012);put(pigeon,fls[k],mFl,po(t,a,.05+k*.008),L.nrm(t,a),V(-1,-.05,sg*.02*k),.05);}
});

// tail fan
{const tg=fGeo(1.35,.2),tm=fc('tail',0x6a7d8c);
 for(let k=0;k<11;k++){const a=(k-5)*.075;
  put(pigeon,tg,tm,V(-1.2,.5+.01*(5-Math.abs(k-5)),0),V(.15,1,0),V(-Math.cos(a),-.25,Math.sin(a)),0);}}

// neck and head: one continuous lofted form (teal neck blending to slate head), head group bobs
const head=new THREE.Group(),c0=C(0x1f5560),c1=C(0x607a8a);
const NL=loft([[1,1],[1.22,1.35],[1.33,1.78],[1.38,2.1],[1.44,2.38],[1.6,2.45],[1.78,2.4],[1.9,2.36]],
 [[.55,.55,.5],[.5,.5,.45],[.4,.4,.37],[.34,.34,.3],[.3,.28,.27],[.3,.27,.27],[.2,.17,.17],[.02,.02,.02]],
 P(0xffffff,{vertexColors:true,metalness:.25,roughness:.45,clearcoat:.4}),t=>c0.clone().lerp(c1,THREE.MathUtils.smoothstep(t,.5,.72)));
head.add(NL.mesh);
{const g=fGeo(.26,.11),rc=[0x7a3f8a,0x4a3f8a,0x20747c,0x1f8a80,0x2a9488];
 [.2,.28,.36,.44,.52].forEach((t,j)=>{const m=fc('plain',rc[j],{metalness:.5,roughness:.3});
  for(let i=0;i<16;i++){const a=(i+(j%2)*.5)/16*Math.PI*2,n=NL.nrm(t,a);put(head,g,m,NL.at(t,a).addScaledVector(n,.01),n,V(-.35,-1,0),.2);}});}

// beak: lathe mandibles, cere sphere, extruded hook
const bg=new THREE.LatheGeometry([[0,0],[.075,.01],[.07,.12],[.045,.26],[0,.34]].map(a=>new THREE.Vector2(a[0],a[1])),20);bg.rotateZ(-Math.PI/2);
const bm=P(0x4a5058,{roughness:.35,clearcoat:.6});
const up=new THREE.Mesh(bg,bm);up.scale.set(1,.7,.9);up.position.set(1.78,2.38,0);head.add(up);
const lo=new THREE.Mesh(bg,bm);lo.scale.set(.85,.5,.75);lo.position.set(1.78,2.32,0);head.add(lo);
const hs=new THREE.Shape();hs.moveTo(0,.03);hs.quadraticCurveTo(.06,.03,.07,-.045);hs.quadraticCurveTo(.03,-.01,0,-.025);hs.closePath();
const hg=new THREE.ExtrudeGeometry(hs,{depth:.05,bevelEnabled:false});hg.translate(0,0,-.025);
const hk=new THREE.Mesh(hg,bm);hk.position.set(2.05,2.385,0);head.add(hk);
head.add(ell(.095,1.3,.8,1.05,P(0xf0eee8,{roughness:.55,clearcoat:.2}),1.86,2.44,0));

// eyes: orange iris, black pupil, grey ring, fleshy lid, glossy cornea
[-1,1].forEach(s=>{
  const e=V(1.66,2.48,s*.245),dir=V(.3,.1,s*.95).normalize(),tg=k=>e.clone().addScaledVector(dir,k);
  head.add(ell(.085,1,1,1,P(0xf06a14,{roughness:.35}),e.x,e.y,e.z));
  const pu=new THREE.Mesh(new THREE.CircleGeometry(.04,24),M(0x050505,{roughness:.3}));pu.position.copy(tg(.0855));pu.lookAt(tg(1));head.add(pu);
  const rg=new THREE.Mesh(new THREE.RingGeometry(.088,.118,32),M(0x8d8f93,{side:THREE.DoubleSide}));rg.position.copy(tg(.06));rg.lookAt(tg(1));head.add(rg);
  const lid=new THREE.Mesh(new THREE.TorusGeometry(.1,.016,10,32),M(0xd0a9a0,{roughness:.6}));lid.position.copy(tg(.062));lid.lookAt(tg(1));head.add(lid);
  head.add(ell(.089,1,1,1,P(0xffffff,{roughness:0,clearcoat:1,transparent:true,opacity:.18}),e.x,e.y,e.z));
});
pigeon.add(head);

// legs: feathered thigh, scaly tarsus (cylinder), curved tube toes, cone claws
const lc=document.createElement('canvas');lc.width=lc.height=64;{const x=lc.getContext('2d');x.fillStyle='#e8795a';x.fillRect(0,0,64,64);
 x.strokeStyle='#a8452c';x.lineWidth=2;for(let i=0;i<8;i++){x.strokeRect(0,i*8,64,8);for(let j=0;j<4;j++){x.beginPath();x.moveTo(j*16+(i%2)*8,i*8);x.lineTo(j*16+(i%2)*8,i*8+8);x.stroke();}}}
const lt=srgb(new THREE.CanvasTexture(lc));lt.wrapS=lt.wrapT=THREE.RepeatWrapping;lt.repeat.set(3,5);
const scaly=M(0xffffff,{map:lt,roughness:.6}),clawM=M(0x2c2a2b,{roughness:.4});
const cg=new THREE.ConeGeometry(.026,.1,10);cg.rotateZ(-Math.PI/2);cg.translate(.05,0,0);
function toe(parent,len,yaw){
  const ca=Math.cos(yaw),sa=-Math.sin(yaw),pts=[0,.33,.66,1].map(t=>V(ca*len*t,.025*Math.sin(Math.PI*t),sa*len*t));
  const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),12,.03,8),scaly);m.castShadow=true;parent.add(m);
  const cl=new THREE.Mesh(cg,clawM);cl.position.copy(pts[3]);cl.rotation.set(0,yaw,-.4);parent.add(cl);
}
tgt=pigeon;
[-1,1].forEach(s=>{
  eb(M(0xbcc8d6,{roughness:.95}),1,.26,.34,.17,.2,.24,s*.3);
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(.04,.05,.6,20),scaly);leg.position.set(.2,-.1,s*.32);leg.castShadow=true;pigeon.add(leg);
  const foot=new THREE.Group();foot.position.set(.2,-.38,s*.32);pigeon.add(foot);
  foot.add(ell(.055,1,1,1,scaly,0,0,0));
  toe(foot,.32,-.5);toe(foot,.36,0);toe(foot,.32,.5);toe(foot,.2,Math.PI);
});
pigeon.position.x=.3;
const spin=new THREE.Group();spin.add(pigeon);scene.add(spin);

const ground=new THREE.Mesh(new THREE.PlaneGeometry(14,14),new THREE.ShadowMaterial({opacity:.32}));
ground.rotation.x=-Math.PI/2;ground.position.y=-.42;ground.receiveShadow=true;scene.add(ground);

let drag=false,lastX=0,angle=0;
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId);canvas.style.cursor='grabbing';});
canvas.addEventListener('pointermove',e=>{if(!drag)return;angle+=(e.clientX-lastX)*.01;lastX=e.clientX;});
const end=()=>{drag=false;canvas.style.cursor='grab';};
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.position.z=Math.max(9.5,9.8/(w/h));camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
const still=matchMedia('(prefers-reduced-motion: reduce)').matches,clock=new THREE.Clock();
(function loop(){const t=clock.getElapsedTime();
  if(!drag&&!still)angle+=.01;
  spin.rotation.y=angle;head.position.x=Math.sin(t*3)*.06;pigeon.position.y=Math.abs(Math.sin(t*3))*.03;
  renderer.render(scene,camera);requestAnimationFrame(loop);})();
</script>
</body>
</html>
